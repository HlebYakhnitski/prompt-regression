[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcheck"
version = "0.1.0"
description = "Regression tests for LLM prompts: assertions, repeats, baselines, record/replay"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "jsonschema>=4", "anthropic>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
promptcheck = "promptcheck.cli:main"

[tool.setuptools]
packages = ["promptcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
